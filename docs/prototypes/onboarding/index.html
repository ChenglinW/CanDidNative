.status{display:flex;align-items:center;justify-content:space-between;padding:17px 26px 12px;font-size:14px;font-weight:700;flex-shrink:0}.status .right{display:flex;align-items:center;gap:7px}.icon{width:22px;height:22px;display:inline-block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.status .icon{width:17px;height:17px}.battery{height:10px;width:22px;border-radius:3px;background:var(--ink);position:relative}.battery:after{content:'';position:absolute;right:-3px;top:3px;height:4px;width:2px;background:var(--ink)}
.top{display:flex;align-items:center;gap:12px;min-height:55px;padding:0 16px;flex-shrink:0}.back,.icon-button{display:grid;place-items:center;border:0;background:transparent;min-width:44px;min-height:44px;border-radius:12px}.top .skip{margin-left:auto}.text-button{border:0;background:none;color:var(--purple);padding:10px 12px;min-height:44px;font-size:14px;font-weight:600}.progress{flex:1;display:flex;gap:5px}.progress i{height:4px;flex:1;border-radius:4px;background:#dbd4c5}.progress i.current{background:var(--purple)}.step{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
#content{overflow:auto;flex:1;min-height:0;padding:10px 24px 26px}.hero{text-align:center;padding-top:32px}.mascot{width:92px;height:92px;object-fit:contain}.hero .mascot{width:165px;height:165px;margin-bottom:23px}.intro{display:flex;align-items:center;gap:13px;margin-bottom:24px}.intro .mascot{width:68px;height:68px}.intro h1{margin:0;font-size:27px;line-height:1.3;letter-spacing:-.025em}.hero h1{font-size:31px;line-height:1.4;letter-spacing:-.025em;margin:0 0 16px;text-wrap:balance}h2{font-size:18px;line-height:1.4;margin:0 0 8px}p{font-size:15px;line-height:1.7;margin:0 0 20px}.muted{color:var(--muted)}.small{font-size:13px}.hero p{margin-bottom:29px}.list{display:flex;flex-direction:column;gap:14px}.choice{display:flex;text-align:left;align-items:center;gap:14px;border:1.5px solid var(--line);background:var(--white);border-radius:22px;padding:18px;width:100%}.choice .tile{width:44px;height:44px;border-radius:13px;background:var(--lavender);display:grid;place-items:center;color:var(--purple)}.choice strong{display:block;font-size:18px;margin-bottom:5px}.choice small{display:block;font-size:13px;line-height:1.6;color:var(--muted)}.choice .check{width:23px;height:23px;border:1.5px solid #b5ac9b;border-radius:50%;margin-left:auto;flex-shrink:0}.choice[aria-pressed=true]{border-color:var(--purple);background:var(--lavender)}.choice[aria-pressed=true] small{color:#655078}.choice[aria-pressed=true] .check{background:var(--purple);border-color:var(--purple);display:grid;place-items:center;color:white}.choice .check .icon{width:15px;height:15px}.hint{margin-top:22px;padding:16px 18px;background:var(--sage);border-radius:18px;font-size:13px;line-height:1.7}.welcome-note{text-align:left;background:var(--white);border-radius:22px;padding:18px;margin-top:20px}.welcome-note p{margin:0;font-size:14px}.field{margin:23px 0 0}.field label{display:block;font-size:15px;font-weight:600;margin:0 0 10px}.optional{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}input,textarea{width:100%;border:1px solid var(--line);border-radius:16px;background:var(--white);padding:14px;font-size:16px;line-height:1.6}input::placeholder,textarea::placeholder{color:var(--muted)}textarea{min-height:136px;resize:vertical}.field .small{margin:8px 0 0}.voice-input{display:flex;gap:10px;align-items:center;padding:10px 0 0}.secondary{display:flex;align-items:center;justify-content:center;gap:9px;background:var(--white);border:1px solid var(--line);border-radius:16px;min-height:50px;padding:12px 16px;font-weight:600;font-size:15px;width:100%}.secondary .icon{color:var(--purple)}.voice-input .secondary{font-size:14px;min-height:44px;padding:9px;width:auto}.upload{border:1.5px dashed #ad9abd;background:var(--white);border-radius:22px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;min-height:135px;color:var(--purple)}.upload .icon{width:30px;height:30px}.upload span{font-size:13px;color:var(--muted)}.file{display:flex;align-items:center;gap:11px;border-bottom:1px solid var(--line);padding:13px 0}.file .icon{color:var(--purple)}.file .name{flex:1;min-width:0}.file strong{display:block;font-size:14px;overflow-wrap:anywhere}.file small{display:block;color:var(--muted);font-size:12px;line-height:1.7}.file .icon-button{min-width:44px;min-height:44px}.preview-note{font-size:12px;color:var(--muted);line-height:1.6;margin:14px 0}.privacy{margin-top:23px;font-size:13px;line-height:1.7}.privacy summary{cursor:pointer;color:var(--purple);padding:8px 0;min-height:44px;display:flex;align-items:center;gap:8px}.privacy p{font-size:13px;color:var(--muted);margin:7px 0 0}.foot{padding:13px 24px 9px;background:var(--paper);flex-shrink:0}.primary{border:0;background:var(--orange);border-radius:16px;min-height:52px;padding:14px 18px;width:100%;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px}.foot .text-button{width:100%;margin-top:3px}.home-indicator{width:125px;height:5px;background:var(--ink);border-radius:5px;margin:13px auto 0}.head-home{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:6px 0 26px}.avatar{width:44px;height:44px;display:grid;place-items:center;background:var(--lavender);border-radius:50%;font-weight:700;color:var(--purple)}.head-home .name{flex:1}.head-home strong{font-size:18px;display:block}.head-home small{font-size:12px;color:var(--muted);display:block;margin-top:5px}.success{margin-bottom:26px}.success .mascot{width:100px;height:100px;display:block;margin:0 auto 12px}.success h1{font-size:25px;line-height:1.4;margin:0 0 12px}.saved{font-size:13px;line-height:1.8;margin-top:18px;padding:14px 16px;border-radius:16px;background:var(--sage)}.saved ul{margin:0;padding-left:18px}.empty{text-align:center;padding:24px 16px;background:var(--white);border-radius:22px;margin-bottom:18px}.empty h2{font-size:19px}.empty p{font-size:14px;margin-bottom:18px}.tabs{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:12px 6px 2px;margin-top:16px}.tabs span{display:flex;align-items:center;gap:5px;flex-direction:column;font-size:11px;color:var(--muted)}.tabs span:first-child{color:var(--purple)}.practice{background:var(--lavender);border-radius:18px;padding:16px 18px;margin-top:18px}.practice p{font-size:14px;margin:0}.notice{font-size:12px;margin-top:14px;color:var(--muted);line-height:1.7}.sheet{position:absolute;inset:0;background:rgba(52,53,46,.26);display:flex;align-items:flex-end;z-index:10}.sheet-body{background:var(--paper);border-radius:28px 28px 0 0;padding:24px;width:100%;max-height:86%;overflow:auto}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.sheet-head h2{margin:0}.sheet-body textarea{margin:0 0 14px}.sheet-body .secondary{margin-top:10px}.sheet-body p{font-size:14px}.error{color:#9c3825;font-size:13px;line-height:1.6;margin:10px 0}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.notes{align-self:center}.notes h2{font-size:25px;line-height:1.4;margin-bottom:16px}.notes p{font-size:14px;color:var(--muted)}.notes nav{display:flex;flex-direction:column;align-items:flex-start;gap:5px;margin:23px 0}.notes nav button{border:0;background:transparent;min-height:44px;padding:9px 0;color:var(--muted);font-size:14px;text-align:left}.notes nav button[aria-current=step]{color:var(--purple);font-weight:700}.notes .preview-label{font-size:12px;line-height:1.7;border-top:1px solid var(--line);padding-top:18px;margin-bottom:15px}.notes .restart{display:flex;align-items:center;gap:8px;padding-left:0}.notes .tip{font-size:13px;color:var(--ink)}
@media(hover:hover){button:hover:not(:disabled){filter:brightness(.97)}.text-button:hover,.notes nav button:hover{color:#59387e}}
@media(max-width:760px){.layout{padding:0;display:block;min-height:100dvh}.phone{width:100%;height:100dvh;min-height:0;max-height:none;border:0;border-radius:0}.notes{display:none}.status{padding-top:max(14px,env(safe-area-inset-top))}.foot{padding-bottom:max(9px,env(safe-area-inset-bottom))}}
@media(min-width:761px) and (max-height:720px){.layout{padding:16px}.phone{height:calc(100dvh - 32px);min-height:0;max-height:none}.hero{padding-top:8px}.hero .mascot{width:115px;height:115px;margin-bottom:16px}}
@media(prefers-reduced-motion:no-preference){.hero .mascot{animation:hello .7s cubic-bezier(.16,1,.3,1) both}@keyframes hello{from{transform:rotate(-8deg) translateY(8px)}to{transform:rotate(0) translateY(0)}}}

<svg class="sr-only" aria-hidden="true"><defs>
<symbol id="arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol><symbol id="back" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol><symbol id="check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol><symbol id="briefcase" viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="14" rx="3"/><path d="M8 7V4h8v3M3 12c5 3 13 3 18 0M12 12v4"/></symbol><symbol id="interview" viewBox="0 0 24 24"><path d="M5 3h14v18H5zM8 16h8M9 12h6"/><circle cx="12" cy="7" r="2"/></symbol><symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3m-4 0h8"/></symbol><symbol id="file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6m-6 4h6"/></symbol><symbol id="upload" viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 15v6h16v-6"/></symbol><symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol><symbol id="home" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M5 10v11h5v-7h4v7h5V10"/></symbol><symbol id="book" viewBox="0 0 24 24"><path d="M12 5v16M3 4c4-1 7 0 9 2 2-2 5-3 9-2v15c-4-1-7 0-9 2-2-2-5-3-9-2z"/></symbol><symbol id="reset" viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 2 6M4 4v7h7"/></symbol><symbol id="wifi" viewBox="0 0 24 24"><path d="M3 8c5-5 13-5 18 0M6 12c3-3 9-3 12 0m-9 4c2-2 4-2 6 0m-3 4h.01"/></symbol><symbol id="lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></symbol>
</defs></svg>
<div class="layout">
<main class="phone" aria-label="Candid 手机原型">
<div class="status" aria-hidden="true"><span>9:41</span><div class="right"><svg class="icon"><use href="#wifi"/></svg><span class="battery"></span></div></div>
<div id="top" class="top"></div><div id="content"></div><footer id="footer" class="foot"></footer><div id="overlay"></div><div id="live" class="sr-only" role="status" aria-live="polite"></div>
</main>
<aside class="notes"><h2>先认识你，<br>再一起准备。</h2><p>保留 Candid 原来的颜色与圆润形态。只问起步需要的背景，其余在沟通中慢慢补齐。</p><nav aria-label="原型页面"></nav><p class="tip" id="screen-note"></p><p class="preview-label">HTML 交互原型 · 不连接后端<br>文件只展示名称；语音使用示例文字。不会录音、解析文件或修改 App 数据。</p><button class="text-button restart" data-action="reset"><svg class="icon"><use href="#reset"/></svg>重新体验</button></aside>
</div>
<script>
const $=s=>document.querySelector(s),icon=n=>`<svg class="icon" aria-hidden="true"><use href="#${n}"/></svg>`,mascot=(cls='')=>`<img class="mascot ${cls}" src="mascot.png" alt="Candid 紫色双气泡">`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state={page:0,types:[],name:'',intro:'',files:[],sheet:null,meeting:'',created:'',finished:false};
const pages=['欢迎','选择用途','介绍自己','带入资料','进入首页'];
const notes=['可以从欢迎页直接进入首页。填写和资料导入都不是使用门槛。','销售 BD 和面试可以同时选择。这是起步偏好，后续仍可切换场景。','称呼和背景都选填。一段话即可，不要求职业、公司、目标分别填表。','资料可稍后补。开始使用就是完成引导，不再增加“确认 AI 理解”步骤。','用户主动提供的背景直接保留；AI 提炼的新个人结论仍按已有规则集中确认。'];
function button(label,action,cls='text-button'){return `<button class="${cls}" data-action="${action}" ${action==='back'?'aria-label="返回上一步"':action==='record'?'aria-label="开始一场录音"':''}>${label}</button>`}
function intro(title){return `<div class="intro">${mascot()}<h1 tabindex="-1">${title}</h1></div>`}
function privacy(){return `<details class="privacy"><summary>${icon('lock')}资料与录音怎么处理？</summary><p>你主动提供的背景会成为个人资料。资料分析会使用已配置的模型服务；AI 产生的新跨场个人结论仍会集中请你核对。录音权限在开始录音时申请，原音频默认保留 90 天，可在设置修改。</p></details>`}
function render(focus=true){
const p=state.page;
$('.notes nav').innerHTML=pages.map((x,i)=>`<button data-page="${i}" ${p===i?'aria-current="step"':''}>${i===0||i===4?'':i+' · '}${x}</button>`).join('');$('#screen-note').textContent=notes[p];
$('#top').innerHTML=p>0&&p<4?`${button(icon('back'),'back','back')}<div class="progress" aria-hidden="true">${[1,2,3].map(i=>`<i class="${i<=p?'current':''}"></i>`).join('')}</div><span class="step">${p} / 3</span>${button('先进入首页','finish','text-button skip')}`:p===0?`<span></span>${button('先体验','finish','text-button skip')}`:`<span class="small muted">首页</span>${button('编辑我的介绍','edit','text-button skip')}`;
let content='',footer='';
if(p===0){content=`<div class="hero">${mascot()}<h1 tabindex="-1">下一次开口，<br>有我一起准备。</h1><p class="muted">记得你的背景，也记得每次沟通。<br>让上一次的经验，帮上下一次的忙。</p></div><div class="welcome-note"><h2>先认识一下就好。</h2><p class="muted">选个用途，聊聊你自己。资料以后补也可以。</p></div>${privacy()}`;footer=button('认识一下 '+icon('arrow'),'next','primary')+button('直接开始，之后再介绍','finish')}
if(p===1){content=intro('你想先准备<br>哪种沟通？')+`<p class="muted">可以多选，也可以先看看。<br>以后随时能切换，不会限制你。</p><div class="list">${[['sales','briefcase','销售 BD','客户沟通、产品介绍与跟进'],['interview','interview','面试','准备经历、练习表达与复盘']].map(([id,ic,title,copy])=>`<button class="choice" data-type="${id}" aria-pressed="${state.types.includes(id)}">${iconTile(ic)}<span><strong>${title}</strong><small>${copy}</small></span><span class="check">${state.types.includes(id)?icon('check'):''}</span></button>`).join('')}</div><div class="hint">这只是让我知道从哪里开始。每个项目仍有独立上下文，录音统一保存在录音库。</div>`;footer=button('继续 '+icon('arrow'),'next','primary')+button('这一步先跳过','skip')}
if(p===2){let ph=state.types.length===1&&state.types[0]==='sales'?'例如：我做餐饮软件销售，常和采购、运营负责人沟通，想把方案价值讲清楚。':state.types.length===1&&state.types[0]==='interview'?'例如：我做产品设计，正在找新的岗位，想把项目经历讲得更具体。':'例如：我做产品设计，最近在准备面试，也会向客户介绍方案。';content=intro('我该怎么<br>认识你？')+`<p class="muted">几句话就够了。你的工作、常见沟通对象，或最近想推进的事。</p><div class="field"><label for="name">怎么称呼你<span class="optional">选填</span></label><input id="name" name="name" autocomplete="nickname" maxlength="40" value="${esc(state.name)}" placeholder="你希望我怎么称呼你"></div><div class="field"><label for="intro">简单介绍一下自己<span class="optional">选填</span></label><textarea id="intro" name="intro" maxlength="2000" placeholder="${ph}">${esc(state.intro)}</textarea><div class="voice-input">${button(icon('mic')+' 用说的','voice','secondary')}<span class="small muted">也可以慢慢打字</span></div></div><p class="notice">你写下的内容会直接保留，之后可在“我”里修改。不用再重复确认一遍。</p>`;footer=button('继续 '+icon('arrow'),'next','primary')+button('这一步先跳过','skip')}
if(p===3){let desc=state.types.length===1&&state.types[0]==='sales'?'产品介绍、报价、服务范围或客户案例。':state.types.length===1&&state.types[0]==='interview'?'简历、岗位 JD，或你做过的项目介绍。':'简历、岗位 JD、产品介绍或项目材料。';content=intro('把熟悉的资料，<br>也介绍给我。')+`<p class="muted">${desc}<br>先给一份就好，没有也能开始。</p><button class="upload" data-action="upload">${icon('upload')}<strong>添加资料</strong><span>PDF · Word · TXT · Markdown</span></button><input id="files" type="file" accept=".pdf,.docx,.txt,.md" multiple hidden><div id="file-list">${fileRows()}</div><p class="preview-note">原型只展示文件名，不读取或上传内容。</p>${button('放入一份示例资料','example')}<div class="hint">资料会先保存，随后整理。缺少报价、排期或经历的地方，我会留空，不会替你编。</div>${privacy()}`;footer=button('开始使用 '+icon('arrow'),'finish','primary')+button('资料稍后再补','skip')}
if(p===4){let summary=[];if(state.types.length)summary.push('常用场景：'+state.types.map(x=>x==='sales'?'销售 BD':'面试').join('、'));if(state.intro)summary.push(state.intro);if(state.files.length)summary.push(state.files.length+' 份资料 · 待整理');content=`<div class="head-home"><span class="avatar">${esc(state.name.slice(0,1)||'我')}</span><span class="name"><strong>${state.name?esc(state.name)+'，你好。':'你好，我是 Candid。'}</strong><small>下一场，一起准备。</small></span>${button(icon('mic'),'record','icon-button')}</div><div class="success">${mascot()}<h1 tabindex="-1">${summary.length?'我们从这里开始。':'先用起来，慢慢认识。'}</h1><p class="muted">${summary.length?'你的背景已经带上了。遇到具体的沟通，我们再一起补充。':'不用先填完资料。告诉我接下来要见谁、聊什么，就可以开始。'}</p>${summary.length?`<div class="saved"><ul>${summary.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}</div><div class="empty"><h2>${state.created?'下一场，已安排。':'下一次，要见谁？'}</h2><p class="muted">${state.created?esc(state.created):'一句话安排沟通，我会沿着项目帮你准备。'}</p>${button(state.created?'查看这场沟通':'准备一次沟通','meeting','primary')}</div>${button('聊聊我最近的事','chat','secondary')}`;footer=`<div class="tabs" aria-label="主导航示意"><span>${icon('home')}首页</span><span>${icon('briefcase')}项目</span><span>${icon('mic')}录音</span><span>${icon('book')}记忆库</span></div>`}
$('#content').innerHTML=content;$('#content').scrollTop=0;$('#footer').innerHTML=footer+'<div class="home-indicator" aria-hidden="true"></div>';renderSheet();if(focus)$('#content h1')?.focus({preventScroll:true});
}
function iconTile(n){return `<span class="tile">${icon(n)}</span>`}
function fileRows(){return state.files.map((f,i)=>`<div class="file">${icon('file')}<span class="name"><strong>${esc(f.name)}</strong><small>${f.example?'示例资料':'已选择'} · 待整理</small></span><button class="icon-button" data-remove="${i}" aria-label="移除 ${esc(f.name)}">${icon('close')}</button></div>`).join('')}
function sync(){if($('#name'))state.name=$('#name').value.trim();if($('#intro'))state.intro=$('#intro').value.trim()}
function finish(){sync();state.finished=true;state.page=4;render()}
function renderSheet(){const o=$('#overlay');if(!state.sheet){o.innerHTML='';$('#content').inert=false;$('#top').inert=false;$('#footer').inert=false;return}$('#content').inert=true;$('#top').inert=true;$('#footer').inert=true;let body='',title='';if(state.sheet==='voice'){title='说说你自己';body=`<p class="muted">App 中点一下开始说，再点一下结束。文字会放入介绍框，继续前仍能修改。</p><div class="practice"><p>语音输入示例：我做产品设计，最近在准备面试，想把项目经历讲得更具体。</p></div><p class="preview-note">这份原型不会开启麦克风。</p>${button('使用这段示例文字','voice-example','primary')}`}
if(state.sheet==='meeting'){title=state.created?'你的下一场':'准备一次沟通';body=`<p class="muted">说说要见谁、谈什么。具体时间不确定，也可以先留空。</p><textarea id="meeting" aria-label="下一场沟通" placeholder="例如：下周和华味餐饮的采购负责人聊试点方案">${esc(state.created||state.meeting)}</textarea><p id="meeting-error" class="error" role="alert"></p>${button('安排这场沟通','create-meeting','primary')}<p class="preview-note">原型只在页面中展示安排，不创建真实项目。</p>`}
if(state.sheet==='chat'){title='问 Candid';body=`<p>你好${state.name?'，'+esc(state.name):''}。${state.intro?'我会带上你刚才介绍的背景。':'我们可以边聊边认识。'}最近有什么沟通想一起准备？</p><textarea id="chat" aria-label="给 Candid 的消息" placeholder="说说最近的事…"></textarea>${button('发送示例消息','send-chat','primary')}<p class="preview-note">这是引导后的对话入口示意，不调用模型。</p>`}
if(state.sheet==='record'){title='开始录音时再连接';body=`<p>正式录音使用安克录音豆。你现在可以先准备沟通，设备连接和权限在需要录音时处理。</p><p class="preview-note">这里展示入口位置，不启动设备或手机录音。</p>${button('知道了','close','primary')}`}
o.innerHTML=`<div class="sheet"><section class="sheet-body" role="dialog" aria-modal="true" aria-label="${title}"><div class="sheet-head"><h2>${title}</h2><button class="icon-button" data-action="close" aria-label="关闭">${icon('close')}</button></div>${body}</section></div>`;o.querySelector('button')?.focus({preventScroll:true})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page!==undefined){sync();state.page=Number(b.dataset.page);render();return}if(b.dataset.type){const id=b.dataset.type;state.types=state.types.includes(id)?state.types.filter(x=>x!==id):[...state.types,id];render(false);$('#content').querySelector(`[data-type="${id}"]`).focus({preventScroll:true});return}if(b.dataset.remove!==undefined){state.files.splice(Number(b.dataset.remove),1);render(false);return}sync();switch(b.dataset.action){case 'next':state.page++;render();break;case 'back':state.page--;render();break;case 'skip':if(state.page===3){finish()}else{state.page++;render()}break;case 'finish':finish();break;case 'edit':state.page=2;render();break;case 'reset':state={page:0,types:[],name:'',intro:'',files:[],sheet:null,meeting:'',created:'',finished:false};render();break;case 'upload':$('#files').click();break;case 'example':if(!state.files.some(f=>f.example))state.files.push({name:state.types.length===1&&state.types[0]==='interview'?'简历 · 示例.pdf':'产品介绍 · 示例.pdf',example:true});render(false);break;case 'voice':case 'meeting':case 'chat':case 'record':state.sheet=b.dataset.action;renderSheet();break;case 'close':state.sheet=null;renderSheet();$('#content h1')?.focus({preventScroll:true});break;case 'voice-example':state.intro='我做产品设计，最近在准备面试，想把项目经历讲得更具体。';state.sheet=null;render(false);$('#intro')?.focus();break;case 'create-meeting':state.meeting=$('#meeting').value.trim();if(!state.meeting){$('#meeting-error').textContent='写一句要见谁、聊什么就好。';$('#meeting').focus();return}state.created=state.meeting;state.sheet=null;render();$('#live').textContent='已展示下一场沟通';break;case 'send-chat':{const v=$('#chat').value.trim();if(v){$('#chat').insertAdjacentHTML('beforebegin',`<p class="practice">${esc(v)}</p><p class="muted">示例消息已展示。正式 App 会在当前范围内回复。</p>`);$('#chat').value=''}break}}});
document.addEventListener('change',e=>{if(e.target.id==='files'){for(const f of e.target.files){if(!/\.(pdf|docx|txt|md)$/i.test(f.name)){$('#live').textContent='请选择 PDF、Word、TXT 或 Markdown 文件';continue}if(!state.files.some(x=>x.name===f.name))state.files.push({name:f.name,example:false})}render(false)}});
document.addEventListener('keydown',e=>{if(!state.sheet)return;if(e.key==='Escape'){state.sheet=null;renderSheet();$('#content h1')?.focus({preventScroll:true})}if(e.key==='Tab'){const els=[...$('#overlay').querySelectorAll('button,textarea,input,a')].filter(x=>!x.disabled);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render(false);
</script>
</body></html>
